<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f3efe4" />
  <title>Still On The Account?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <section id="start" class="screen active">
      <div class="eyebrow">AN AD AGENCY SURVIVAL GAME</div>
      <h1>STILL ON<br>THE ACCOUNT?</h1>
      <p class="lead">Your client has feedback. Again.</p>
      <div class="warning">Say the wrong thing and the account is gone.</div>
      <button class="primary" id="startBtn">START THE MEETING</button>
      <p class="tiny">10 questions · 12 sec each · 1 recall message</p>
    </section>

    <section id="game" class="screen">
      <header class="game-head">
        <div>
          <div class="eyebrow">ACCOUNT RISK</div>
          <div class="meter"><div id="riskBar"></div></div>
        </div>
        <div class="risk-num"><span id="riskNum">50</span>/100</div>
      </header>

      <div class="meta-row">
        <span id="roundLabel">ROUND 01 / 10</span>
        <span id="timer">12</span>
      </div>

      <article class="question-card">
        <div class="client-tag">CLIENT</div>
        <h2 id="question"></h2>
      </article>

      <div id="answers" class="answers"></div>
      <div id="feedback" class="feedback"></div>
      <button id="recallBtn" class="secondary">RECALL MESSAGE <span>1 LEFT</span></button>
    </section>

    <section id="result" class="screen result-screen">
      <div class="eyebrow">MEETING OVER</div>
      <div id="resultRisk" class="score">50</div>
      <div class="score-label">ACCOUNT RISK</div>
      <h2 id="resultTitle"></h2>
      <p id="resultCopy" class="lead"></p>
      <div id="cause" class="cause"></div>
      <button class="primary" id="restartBtn">TRY ANOTHER MEETING</button>
      <button class="secondary" id="copyBtn">COPY RESULT</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
